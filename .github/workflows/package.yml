name: Check and release desktop app

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Prepare terminal native module for tests
        working-directory: apps/desktop
        run: bun x --no-install electron-builder install-app-deps
      - run: bun run test --maxWorkers=4
      # The web app is deployed after the release is public (the relay job), so a failing export must fail here, before a tag.
      - name: Build the web app
        working-directory: packages/relay
        run: bun run site

  package:
    name: Package ${{ matrix.platform }} (${{ matrix.arch }})
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            arch: arm64
            extension: dmg
          - platform: macos
            runner: macos-15-intel
            arch: x64
            extension: dmg
          - platform: windows
            runner: windows-2022
            arch: x64
            extension: exe
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            extension: AppImage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # Electron's download must exist even when Bun skips dependency lifecycle scripts.
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Build installer
        shell: bash
        run: |
          args=("--$BUILD_ARCH")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=("--config.extraMetadata.version=${GITHUB_REF_NAME#v}")
          fi
          bun run package "${args[@]}"
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS installer launch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          probe=$(mktemp -d)
          mkdir "$probe/mount" "$probe/install"
          mounted=false
          cleanup() {
            # Keep temporary test bundles out of future Finder and Dock resolution.
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -u "$probe/install/Outlore.app" >/dev/null 2>&1 || true
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$probe/mount" || return
            fi
            rm -rf "$probe"
          }
          trap cleanup EXIT
          images=(apps/desktop/release/*.dmg)
          [[ ${#images[@]} -eq 1 ]]
          hdiutil verify "${images[0]}"
          hdiutil attach -nobrowse -readonly -mountpoint "$probe/mount" "${images[0]}"
          mounted=true
          # A fresh copy also avoids reusing a macOS cached launch-block decision from an earlier install.
          cp -RX "$probe/mount/Outlore.app" "$probe/install/Outlore.app"
          codesign --verify --deep --strict "$probe/install/Outlore.app"
          bun apps/desktop/scripts/check-package.ts "$probe/install/Outlore.app"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*.${{ matrix.extension }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      # electron-updater reads this file on Windows and Linux; the macOS updater uses SHA512SUMS.txt, made at release.
      - name: Upload update file
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/latest*.yml
          archive: false
          if-no-files-found: error
          retention-days: 14

  android:
    name: Package Android app
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The mobile app is the same Expo app as the web app and the desktop window, built natively (0009). Expo generates
    # the android/ folder (it is not committed) and Gradle builds one APK for current phones (arm64-v8a).
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Stamp the tag into the app's release
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The host refuses a web or mobile app of another release than its own, so the APK carries the tag's release.
          node -e '
            const fs = require("node:fs");
            const file = "apps/app/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.RELEASE_TAG.replace(/^v/, "");
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '
          grep '"version"' apps/app/package.json
      - name: Prepare the release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            # An update installs over the previous app only when both carry the same key, so a release is never signed
            # with a throwaway one. A manual run (not a tag) may build with the debug key to check the build.
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "::error::The Android release key is not set: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to the repository's secrets."
              exit 1
            fi
            echo "No release key: this manual run signs with the debug key."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/outlore-release.jks"
          {
            echo "SIGNING=release"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/outlore-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Generate the Android project
        working-directory: apps/app
        run: bunx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Check and name the APK
        shell: bash
        run: |
          apks=(apps/app/android/app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} -eq 1 ]]
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "${apks[0]}" | tee "$RUNNER_TEMP/certs.txt"
          if [[ "$SIGNING" == "release" ]]; then
            ! grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"
            name="Outlore-$(node -p 'require("./apps/app/package.json").version')-android.apk"
          else
            name="Outlore-$(node -p 'require("./apps/app/package.json").version')-android-debug-signed.apk"
          fi
          mkdir apk
          cp -- "${apks[0]}" "apk/$name"
          test -s "apk/$name"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: apk/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish installers and Android app
    needs: [package, android]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Outlore-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: "latest*.yml"
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Publish only after every platform succeeded and every installer is present.
          files=(installers/*.dmg installers/*.exe installers/*.AppImage installers/*.apk)
          [[ ${#files[@]} -eq 5 ]]
          for file in "${files[@]}"; do test -s "$file"; done
          # The Windows and Linux update files, and the checksums the installed macOS app checks its download against.
          updates=(installers/latest*.yml)
          test "${#updates[@]}" -eq 2
          for file in "${updates[@]}"; do test -s "$file"; done
          (cd installers && sha512sum -- *.dmg *.exe *.AppImage *.apk > SHA512SUMS.txt)
          test -s installers/SHA512SUMS.txt
          isPrerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then isPrerelease=true; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A failed upload can resume its draft; published releases stay immutable.
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft --prerelease="$isPrerelease"
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" "${updates[@]}" installers/SHA512SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$isPrerelease"

  relay:
    name: Deploy relay and web app
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The shared relay serves the web app (CHG-0287): the page and the installed app must come from one tag, so a browser
    # and the host it pairs with report the same release.
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      WEB_APP_URL: https://outlore.dyrits.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Stamp the tag into the web app's release
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "apps/app/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.RELEASE_TAG.replace(/^v/, "");
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '
          grep '"version"' apps/app/package.json
      - name: Build the web app
        working-directory: packages/relay
        run: bun run site
      - name: Deploy the Worker with the web app
        working-directory: packages/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.162.0 deploy
      - name: Check the live address
        run: |
          # The page opens at any path, a room path without an upgrade is the relay's own answer, and a bad one is not found.
          curl -fsS --retry 5 --retry-delay 3 "$WEB_APP_URL/" | grep -q '<title>Outlore</title>'
          curl -fsS --retry 5 --retry-delay 3 "$WEB_APP_URL/some/path" | grep -q '<title>Outlore</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_APP_URL/r/abcdefghijklmnopqrstuvwxyz012345?role=client")" = 426
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB_APP_URL/r/x")" = 404
