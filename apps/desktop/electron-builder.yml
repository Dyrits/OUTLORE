# The installed Outlore, built for the host platform by `bun run package` (see ADR 0013).
appId: app.outlore.desktop
productName: Outlore
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
# Reuses the Electron the repository already installed, so packaging downloads no second copy.
electronDist: node_modules/electron/dist
electronVersion: 45.3.1
# The installed app looks for its updates in this repository's releases; electron-builder writes the update files that Windows and Linux read (macOS, ad hoc signed, updates through its own updater).
publish:
  provider: github
  owner: Dyrits
  repo: OUTLORE
# Registers `outlore://` with the system (Info.plist on macOS, the registry on Windows, the desktop entry on Linux), so a pairing link opens the app (device-pairing).
protocols:
  - name: Outlore pairing link
    schemes:
      - outlore
# Linux has no node-pty prebuild; rebuild native dependencies for the packaged Electron.
npmRebuild: true
directories:
  output: release
files:
  - dist/**
  - assets/icon.png
  - assets/one.LICENSE
  - package.json
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../packages/channel/NOTICE
    to: channel-NOTICE
# node-pty's native binary and its spawn helper must run from disk, not from inside the archive.
asarUnpack:
  - "**/node_modules/node-pty/**"
# Turns off the Electron fuses the app does not use, before this build is signed (ST-H-09).
afterPack: scripts/afterPack.cjs
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  # No signing identity yet: "-" ad hoc signs the whole bundle, which is enough to run on the computer that built it (null would leave Electron's own, now broken, seal).
  identity: "-"
  # The hardened runtime is for notarized builds; with an ad hoc seal its library validation would refuse node-pty's native module.
  hardenedRuntime: false
  target:
    - dmg
dmg:
  title: Outlore
win:
  icon: assets/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  icon: assets/icon.png
  target:
    - AppImage
