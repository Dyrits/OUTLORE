<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlore sidebar · Five directions</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #eceeea; color: #232b27; font: 15px/1.5 system-ui, sans-serif; }
button, select { font: inherit; color: inherit; }
button, summary, select { cursor: pointer; }
:focus-visible { outline: 2px solid #397cc7; outline-offset: 2px; }
main { max-width: 758px; margin: auto; padding: 35px 20px 115px; }
header { margin-bottom: 23px; }
header p { margin: 0 0 4px; color: #516158; font-size: 13px; font-weight: 650; }
h1 { margin: 0; font-size: clamp(27px, 6vw, 42px); line-height: 1.12; letter-spacing: -.045em; }
#description { margin: 10px 0 0; max-width: 64ch; color: #47534c; min-height: 3em; }
.comparison { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
figure { margin: 0; min-width: 0; }
figcaption { margin-bottom: 7px; color: #46544c; font-size: 13px; font-weight: 650; }
.reference img, .sidebar { width: 100%; display: block; border: 1px solid #cfd4cb; border-radius: 10px; }
.reference img { aspect-ratio: 349 / 493; }
.sidebar {
  --paper: #f7f7f7;
  --ink: #525356;
  --muted: #57585b;
  --line: #dadada;
  --hover: #e4e5e5;
  --select: #c8c8c8;
  --active: #202226;
  --accent: #2138a2;
  display: flex; flex-direction: column; min-height: 493px; aspect-ratio: 349 / 493;
  background: var(--paper); color: var(--ink); padding: 0 14px 14px 0;
  font-size: 14px; line-height: 1.25;
}
.sidebar button { border: 0; background: transparent; text-align: start; }
.chronicle { min-height: 52px; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--active); font-weight: 650; }
.badge { display: grid; place-items: center; border: 1px solid currentColor; color: var(--accent); width: 18px; height: 16px; border-radius: 50%; font-size: 11px; }
.divider { display: flex; align-items: center; justify-content: center; gap: 7px; height: 1px; margin: 0 5px 12px 2px; color: #c7c7c7; }
.divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.divider span { font-size: 13px; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ''; width: 5px; height: 5px; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(-45deg); margin-right: 4px; flex: none; }
details[open] > summary::before { transform: rotate(45deg) translate(-1px,-1px); }
.row { display: flex; min-height: 30px; align-items: center; gap: 5px; width: 100%; padding: 5px 8px; border-radius: 0 6px 6px 0; }
.sidebar :is(button, summary, select):hover { background: var(--hover); }
.section-title { font-weight: 700; }
.realms-group { position: relative; }
.realms-group > summary { background: #dedede; padding-right: 38px; }
.add { position: absolute; top: 0; right: 4px; width: 30px; height: 30px; font-size: 21px; text-align: center !important; border-radius: 6px; }
.realm > summary { font-weight: 700; }
.folder { width: 13px; height: 13px; flex: none; }
.quest { padding-left: 22px; }
.quest::before { content: ''; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; flex: none; }
.sidebar [aria-current="true"] { background: var(--select); color: var(--active); font-weight: 700; }
.borderlands { margin-top: 12px; }
.borderlands button, .borderlands p, .realm p { display: block; padding: 5px 18px; margin: 0; font-style: italic; color: var(--muted); }
.sidebar[data-style="type"] { font-family: Avenir Next, Avenir, sans-serif; }
.sidebar[data-style="quiet"] {
  --paper: #fbfcfa; --ink: #3d4c47; --active: #173c33; --muted: #556761;
  --line: #dbe4dd; --hover: #edf3ee; --select: #e0eee6; --accent: #24765b;
  padding: 0 16px 16px; font-family: system-ui, sans-serif;
}
.quiet .chronicle { justify-content: start; padding: 0 8px; }
.quiet .divider span, .ledger .divider span, .dock .divider, .focus .divider span { display: none; }
.quiet .realms-group > summary, .ledger .realms-group > summary, .dock .realms-group > summary { background: transparent; }
.quiet .section-title, .dock .section-title { color: var(--muted); font-size: 12px; font-weight: 650; }
.quiet .row { border-radius: 6px; min-height: 33px; }
.quiet .realm > summary { font-weight: 550; }
.quiet .realm[open] > summary { font-weight: 700; color: var(--active); }
.quiet .quests { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 5px; }
.quiet .quest { padding-left: 9px; gap: 8px; }
.quiet .quest::before { width: 5px; height: 5px; }
.quiet .borderlands :is(p,button), .dock .borderlands :is(p,button), .focus .borderlands :is(p,button) { font-style: normal; font-size: 13px; }
.sidebar[data-style="ledger"] {
  --paper: #f8f6f0; --ink: #433c40; --active: #622641; --muted: #63565c;
  --line: #dcd2d0; --hover: #f1eae8; --select: #efe1e7; --accent: #873e5e;
  padding: 0 19px 16px; font-family: Georgia, serif; font-size: 15px;
}
.ledger .chronicle { justify-content: space-between; font-size: 25px; height: 65px; }
.ledger .badge { font: 600 11px system-ui; }
.ledger .section-title { font-size: 16px; }
.ledger .realm > summary { font-weight: 400; }
.ledger .realm[open] { border-block: 1px solid var(--line); margin: 4px 0; padding: 4px 0; }
.ledger .realm[open] > summary { font-weight: 700; }
.ledger .folder { display: none; }
.ledger .row { min-height: 33px; border-radius: 0; }
.ledger .quest { padding-left: 19px; gap: 10px; }
.ledger .quest::before { width: 9px; height: 2px; border-radius: 0; }
.ledger [aria-current="true"] { box-shadow: inset 2px 0 var(--accent); }
.sidebar[data-style="dock"] {
  --paper: #232a38; --ink: #dee5f1; --active: #f7faff; --muted: #b6c4d9;
  --line: #42516b; --hover: #333f56; --select: #344970; --accent: #a9c9ff;
  padding: 0 13px 13px; font-family: system-ui, sans-serif;
}
.dock .chronicle { justify-content: space-between; padding: 0 10px; order: 3; border-top: 1px solid var(--line); flex: none; }
.dock .realms-group { padding-top: 10px; }
.dock .add { top: 10px; }
.dock .realm[open] { background: #2a3448; border-radius: 9px; padding: 3px 5px 6px; margin-block: 3px; }
.dock .row { min-height: 34px; border-radius: 6px; }
.dock .borderlands { margin-top: auto; padding-top: 12px; padding-bottom: 10px; }
.dock .quest::before { background: transparent; border: 1px solid var(--accent); width: 6px; height: 6px; }
.dock .quest[aria-current="true"]::before { background: var(--accent); }
.sidebar[data-style="focus"] {
  --paper: #f2f5f6; --ink: #29383f; --active: #183b4e; --muted: #526770;
  --line: #d2dfe4; --hover: #e5eef2; --select: #d4e6ee; --accent: #266682;
  padding: 0 15px 15px; font-family: system-ui, sans-serif;
}
.focus .chronicle { justify-content: space-between; padding-inline: 4px; }
.realm-picker { display: flex; align-items: center; gap: 5px; }
.realm-picker label { flex: 1; font-size: 12px; font-weight: 650; color: var(--muted); }
.realm-picker select { display: block; margin-top: 4px; width: 100%; min-height: 35px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: #fff; font-size: 14px; font-weight: 650; }
.realm-picker .add { position: static; align-self: end; margin-bottom: 2px; }
.focus h2 { margin: 22px 0 6px; color: var(--muted); font-size: 12px; }
.focus .quests { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.focus .quest { padding-inline: 9px; gap: 9px; border-radius: 5px; min-height: 37px; }
.focus .borderlands { margin-top: auto; padding-top: 20px; }
.focus .empty { padding: 9px; }
.switcher { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 12px; background: #242f29; color: white; box-shadow: 0 4px 18px #202e2738; max-width: calc(100% - 24px); }
.switcher button { border: 0; border-radius: 7px; background: #43564b; padding: 7px 12px; }
.switcher button:hover { background: #596f61; }
.switcher select { min-width: 0; border: 0; border-radius: 7px; background: #242f29; padding: 6px; }
#feedback { min-height: 1.5em; font-size: 13px; color: #46544c; }
</style>
</head>

<div class="switcher" role="group" aria-label="Choose a sidebar design">
  <button type="button" id="previous" aria-label="Previous design">←</button>
  <select id="design" aria-label="Sidebar design"></select>
  <button type="button" id="next" aria-label="Next design">→</button>
</div>
<script>
const designs = [
  { key: 'type', name: 'Typeface only', description: 'Avenir Next in a recreation of the current layout. Use this to judge how much of the difference comes from the typeface.' },
  { key: 'quiet', name: 'Quiet tree', description: 'Lighter realm labels, an indented branch for quests, and a soft green selection make each level easier to spot.' },
  { key: 'ledger', name: 'Ledger', description: 'Georgia, a larger Chronicle, and a ruled band around the expanded realm give the sidebar a bookish feel.' },
  { key: 'dock', name: 'Dark dock', description: 'A dark sidebar groups open quests on a raised surface and moves Chronicle to the bottom edge.' },
  { key: 'focus', name: 'Realm focus', description: 'Switch realms from a picker and give the full width of the sidebar to the current realm’s quests.' }
];
const realms = ['API-GATEWAY', 'CLOUD-NOTIF', 'POS Payment App', 'Outlore', 'QUALITY HUB'];
const quests = ['Delayed quest replies', 'Gemini and Copilot logos', 'Providers: installed only'];
const folder = '<svg class="folder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.7a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v5.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>';
const divider = '<div class="divider" aria-hidden="true"><span>◆</span></div>';
const add = '<button type="button" class="add" aria-label="Add realm" data-action="Add realm">+</button>';
const chronicle = '<button type="button" class="chronicle" data-action="Chronicle">Chronicle <span class="badge" aria-label="1 notification">1</span></button>';
const borderlands = `<section class="borderlands" aria-label="Borderlands">${divider}
  <details open><summary class="row section-title">Borderlands</summary>
    <button type="button" data-action="Borderlands chat">Borderlands chat</button>
    <p>No quest in the Borderlands yet.</p>
  </details></section>`;
const sidebar = document.querySelector('#preview');
const designPicker = document.querySelector('#design');
const feedback = document.querySelector('#feedback');
let selection = quests[2];
let focusedRealm = 'Outlore';
let variant = 0;

function questList() {
  return `<div class="quests">${quests.map((quest, index) =>
    `<button type="button" class="row quest" data-quest="${index}" aria-current="${quest === selection}">${quest}</button>`
  ).join('')}</div>`;
}

function tree() {
  return `<div class="realms-group">
    <details open><summary class="row section-title">Realms</summary>
    ${realms.map(realm => `<details class="realm" ${realm === 'Outlore' ? 'open' : ''}>
      <summary class="row">${folder}${realm}</summary>
      ${realm === 'Outlore' ? questList() : '<p>No sample quests.</p>'}
    </details>`).join('')}
    </details>${add}
  </div>`;
}

function realmFocus() {
  return `<div class="realm-picker">
    <label>Realm <select id="realm-picker">${realms.map(realm =>
      `<option ${realm === focusedRealm ? 'selected' : ''}>${realm}</option>`).join('')}</select></label>
    ${add}
  </div><h2>Quests</h2>${focusedRealm === 'Outlore' ? questList() : '<p class="empty">No sample quests.</p>'}`;
}

function renderSidebar() {
  const { key } = designs[variant];
  sidebar.dataset.style = key;
  sidebar.className = 'sidebar ' + key;
  const content = key === 'focus' ? realmFocus() : tree();
  sidebar.innerHTML = key === 'dock'
    ? content + borderlands + chronicle
    : chronicle + divider + content + borderlands;
}

function showVariant(index, updateUrl = true) {
  variant = (index + designs.length) % designs.length;
  const { key, name, description } = designs[variant];
  designPicker.value = key;
  document.querySelector('#heading').textContent = name;
  document.querySelector('#description').textContent = description;
  feedback.textContent = '';
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set('variant', key);
    history.replaceState(null, '', url);
  }
  renderSidebar();
}

designPicker.innerHTML = designs.map(({ key, name }, index) =>
  `<option value="${key}">${index + 1} · ${name}</option>`).join('');
designPicker.addEventListener('change', () => showVariant(designPicker.selectedIndex));
document.querySelector('#previous').addEventListener('click', () => showVariant(variant - 1));
document.querySelector('#next').addEventListener('click', () => showVariant(variant + 1));
document.querySelector('.switcher').addEventListener('keydown', event => {
  if (event.target.tagName !== 'BUTTON' || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  showVariant(variant + (event.key === 'ArrowRight' ? 1 : -1));
});
sidebar.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.quest !== undefined) {
    selection = quests[Number(button.dataset.quest)];
    for (const quest of sidebar.querySelectorAll('[data-quest]')) {
      quest.setAttribute('aria-current', String(quest === button));
    }
    feedback.textContent = `Selected ${selection}.`;
  } else {
    feedback.textContent = `${button.dataset.action} is a preview control.`;
  }
});
sidebar.addEventListener('change', event => {
  if (event.target.id !== 'realm-picker') return;
  focusedRealm = event.target.value;
  renderSidebar();
  document.querySelector('#realm-picker').focus();
  feedback.textContent = `Showing ${focusedRealm}.`;
});
const key = new URL(location.href).searchParams.get('variant');
showVariant(Math.max(0, designs.findIndex(design => design.key === key)), false);
</script>
</body>
